<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Redirect stub for /gift-cards, the one address the site, Instagram and print use
     for gift cards. Only this file names the Toast eGift Card Shop, so a new link or
     provider changes nothing else. GitHub Pages cannot send a 301, so an instant meta
     refresh stands in for one. -->
<title>Umbo Gift Cards</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=TOAST_EGIFT_URL">
<script>location.replace('TOAST_EGIFT_URL');</script>
</head>
<body>
<p>Buy an Umbo gift card at <a href="TOAST_EGIFT_URL">our gift card shop</a>.</p>
</body>
</html>
