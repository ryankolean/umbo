<!-- Redirect stub for /events/, so the new events/ folder never shadows events.html. It still 404s for Google, which is why

<meta name="robots" content="noindex">
<link rel="canonical" href="https://eatumbo.com/events.html">
<meta http-equiv="refresh" content="0; url=/events.html">
<script>location.replace('/events.html');</script>
</head>

</body>
