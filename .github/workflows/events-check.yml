name: Events check

# scripts/event-check.py fails when an event page is missing a required field,
# is not in the sitemap or on events.html, or still emits Event JSON-LD after
# the event is over. The daily run is the reminder to retire a past event: a
# red run emails Ryan. See docs/events.md.

on:
  schedule:
    # 6:17am ET in winter, the morning after an evening event.
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/event-check.py
